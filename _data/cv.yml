    Projects:
      - name: "Viam Edge of Intelligence Hackathon: Winner, “Teach It by Showing” Challenge"
        url: https://www.linkedin.com/feed/update/urn:li:activity:7529573933327671296/
        start_date: 2026-11
        summary: "Team of 4, 15-hour build; won out of 9 teams on the challenge track, New York, NY"
        highlights:
          - "Designed a hierarchical pick-and-pack system for a UFactory xArm in clutter: a state-machine orchestrator for high-level planning (policy selection, visual verification, retries), learned policies for grasping, classical placement."
          - "Trained ACT for rigid objects and SmolVLA for deformable ones (cap, T-shirt), where ACT lacked grasp coverage."
          - "Built a SAM3 pipeline masking distractors in training and inference, letting ~20–25 teleop demos per object generalize across clutter and real demos match MuJoCo renders for synthetic-data augmentation."

      - name: Diagnosing View-Consistency Failures in Affordance Prediction Models
        url: https://github.com/shilpitha-03/ViewConsistency_affordance
        start_date: 2026-01
        end_date: 2026-05
        summary: "Graduate course research project"
        highlights:
          - "Diagnosed failure modes across two affordance pipelines (RoboPoint/CLIP, GAT/DINOv2) and showed the dominant failure axis is functional-part visibility rather than viewpoint: grasp confidence fell from 0.99 (part visible) to 0.56 (fully occluded)."
          - "Proposed the model's internal grasp-confidence score as a training-free signal a downstream VLA policy can read to trigger active perception, requiring no retraining of the affordance backbone."

      - name: Multimodal Retrieval-Augmented Generation for Surgical Documentation
        start_date: 2026-01
        summary: "Graduate research, ongoing"
        highlights:
          - "Adapting a multimodal RAG pipeline to automate surgical operative-note generation from procedural video, as part of a research team working toward publication."

      - name: Multi-Task Imitation Learning on SO-101 Arm
        start_date: 2026-08
        end_date: 2026-12
        summary: "Graduate course project"
        highlights:
          - "Collected teleoperated demonstrations and trained LeRobot policies for cube pick-and-place and cube stacking."

      - name: Long-Horizon Robot Learning with Adaptive Replay Sampling
        start_date: 2026-08
        end_date: 2026-12
        summary: "Graduate course project"
        highlights:
          - "Reproducing DEMO3 results and extending them with adaptive replay-buffer sampling for long-horizon manipulation."

      - name: Probing Visual Affordance in Vision-Language-Action Encoders
        url: https://github.com/shilpitha-03/VLA-affordance
        start_date: 2026-01
        end_date: 2026-05
        summary: "Research contributor — graduate course research project"
        highlights:
          - "Characterized how part/affordance structure evolves across VLA fine-tuning stages (SigLIP → π0 → π0.5) using per-layer PCA and subspace-projection analysis, identifying a stage-specific representation collapse invisible to supervised probing."

      - name: Neural Deblurring for Robust Image Stitching
        url: https://github.com/shilpitha-03/CVFinalProject
        start_date: 2025-08
        end_date: 2025-12
        highlights:
          - "Built a panorama-stitching pipeline pairing a fine-tuned Restormer deblurring model with SIFT/SuperPoint feature matching; cut reprojection error 34% versus a SIFT-only baseline on 200+ motion-blurred pairs."

      - name: Autonomous Personal Load Carrier - Sensing & Navigation
        start_date: 2026-08
        end_date: 2026-12
        summary: "Graduate team project"
        highlights:
          - "Developing sensor fusion and filtering/tracking for an autonomous load-carrying robot, validated in Gazebo."

