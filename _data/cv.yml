    Projects:
      - name: Diagnosing View-Consistency Failures in Affordance Prediction Models
        url: https://github.com/shilpitha-03/ViewConsistency_affordance
        start_date: 2026-01
        end_date: 2026-05
        summary: "Graduate course research project"
        highlights:
          - "Diagnosed failure modes across two affordance pipelines (RoboPoint/CLIP, GAT/DINOv2) and showed the dominant failure axis is functional-part visibility rather than viewpoint: grasp confidence fell from 0.99 (part visible) to 0.56 (fully occluded)."
          - "Proposed the model's internal grasp-confidence score as a training-free signal a downstream VLA policy can read to trigger active perception, requiring no retraining of the affordance backbone."

      - name: Multimodal Retrieval-Augmented Generation for Surgical Documentation
        start_date: 2026-01
        summary: "Graduate research, ongoing"
        highlights:
          - "Adapting a multimodal RAG pipeline to automate surgical operative-note generation from procedural video, as part of a research team working toward publication."

      - name: Probing Visual Affordance in Vision-Language-Action Encoders
        url: https://github.com/shilpitha-03/VLA-affordance
        start_date: 2026-01
        end_date: 2026-05
        summary: "Research contributor — graduate course research project"
        highlights:
          - "Characterized how part/affordance structure evolves across VLA fine-tuning stages (SigLIP → π0 → π0.5) using per-layer PCA and subspace-projection analysis, identifying a stage-specific representation collapse invisible to supervised probing."

      - name: Neural Deblurring for Robust Image Stitching
        url: https://github.com/shilpitha-03/CVFinalProject
        start_date: 2025-08
        end_date: 2025-12
        highlights:
          - "Built panorama stitching pipeline combining neural deblurring (fine-tuned Restormer) with SIFT and SuperPoint feature matching to handle motion-blurred images, testing on a custom dataset of 200+ image pairs."
          - "Improved feature matching inlier ratio and reduced reprojection error by 34% through fine-tuning Restormer on custom motion-blur dataset versus SIFT-only baseline."

      - name: Underwater Vehicle Manipulator System (UVMS)
        start_date: 2024-08
        end_date: 2025-05
        highlights:
          - "Modeled full dynamic coupling of underwater vehicle-manipulator system in Simulink, incorporating environmental disturbances including water currents and hydrodynamic forces."
          - "Designed Sliding Mode Controller for UVMS trajectory tracking, validating robustness to disturbances through simulation-based performance evaluation."

      - name: Self-Balancing Omniwheel RC Bike
        start_date: 2023-08
        end_date: 2024-05
        highlights:
          - "Reached the final round of the E-Yantra national competition (IIT Bombay) by implementing an LQR controller for a self-balancing omniwheel robot with <3° tilt tolerance, validated through CoppeliaSim simulation and hardware testing."

      - name: Wrist Rehabilitation Robot
        start_date: 2024-01
        end_date: 2025-01
        highlights:
          - "Designed 2-DOF wrist rehabilitation robot with game-based therapy interface, fabricating 3D-printed mechanical components and integrating servo control system for adjustable resistance based on patient range of motion."

